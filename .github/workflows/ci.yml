name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null

      - name: Compile helper
        run: python -m py_compile scripts/choosium.py

      - name: Test helper
        run: python -W error -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test QML model
        run: node --test tests/test_model.js
